<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Rajasthan Sandstone Hub</title>
<link rel="icon" href="stone.png" type="image/png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ===== General ===== */
:root {
  --primary: #c7a97b;
  --primary-dark: #a58a62;
  --secondary: #5a4a3a;
  --light: #f8f5f0;
  --dark: #333;
  --gray: #e0e0e0;
  --success: #28a745;
  --danger: #dc3545;
  --shadow: 0 4px 12px rgba(0,0,0,0.1);
  --radius: 8px;
  --transition: all 0.3s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  line-height: 1.6;
  color: var(--dark);
  background: var(--light);
  min-height: 100vh;
}

/* ===== Sidebar ===== */
.sidebar {
  width: 250px;
  background: var(--primary);
  color: white;
  padding: 20px 0;
  position: fixed;
  height: 100vh;
  overflow-y: auto;
  box-shadow: 2px 0 10px rgba(0,0,0,0.1);
  z-index: 1000;
  transition: var(--transition);
}
.sidebar.collapsed { width: 70px; }
.sidebar.hidden { transform: translateX(-100%); }
.sidebar-header {
  padding: 0 20px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar.collapsed .sidebar-header { justify-content: center; padding: 0 10px 20px; }
.sidebar-logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 1.3rem; font-weight: 700;
}
.sidebar.collapsed .sidebar-logo span { display: none; }
.sidebar-logo img { height: 40px; border-radius: 5px; }
.sidebar-toggle {
  background: none; border: none; color: white;
  font-size: 1.2rem; cursor: pointer; padding: 5px;
  border-radius: 50%; transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.sidebar-toggle:hover { background: rgba(255,255,255,0.1); }
.sidebar.collapsed .sidebar-toggle { transform: rotate(180deg); }
.sidebar-nav { list-style: none; }
.sidebar.collapsed .sidebar-nav span { display: none; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; color: white; text-decoration: none;
  transition: var(--transition); border-left: 3px solid transparent;
  white-space: nowrap;
}
.sidebar.collapsed .sidebar-nav a { padding: 12px; justify-content: center; }
.sidebar-nav a:hover, .sidebar-nav a.active {
  background: rgba(255,255,255,0.1);
  border-left-color: white;
}
.sidebar-nav i { width: 20px; text-align: center; flex-shrink: 0; }

/* ===== Main Content ===== */
.main-content {
  flex: 1;
  margin-left: 250px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: var(--transition);
}
.main-content.expanded { margin-left: 70px; }

/* ===== Header ===== */
.top-header {
  background: white;
  padding: 10px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow);
  position: sticky; top: 0; z-index: 999;
  gap: 15px; min-height: 60px;
}
.user-profile { display: flex; align-items: center; gap: 15px; margin-left: auto; }
.user-info {
  display: flex; align-items: center; gap: 10px;
  background: var(--light); padding: 6px 12px; border-radius: var(--radius);
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary); color: white;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 0.8rem;
}
.user-name { font-weight: 600; color: var(--secondary); white-space: nowrap; font-size: 0.9rem; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  padding: 8px 14px; border-radius: var(--radius);
  font-weight: 600; transition: var(--transition);
  display: inline-flex; align-items: center; gap: 5px;
  cursor: pointer; border: none; font-size: 13px;
  text-decoration: none; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
.btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
.btn-outline:hover { background: var(--primary); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { filter: brightness(0.9); }

/* ===== Login Screen ===== */
.login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; background: var(--light); padding: 20px;
}
.login-box {
  background: white; padding: 40px 35px;
  border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  width: 100%; max-width: 400px; text-align: center;
}
.login-box .icon-circle {
  width: 70px; height: 70px; border-radius: 50%;
  background: var(--light); color: var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; margin: 0 auto 20px;
}
.login-box h2 {
  color: var(--secondary); margin-bottom: 8px;
  font-size: 1.5rem; font-weight: 700;
}
.login-box p { color: #888; font-size: 0.85rem; margin-bottom: 25px; }
.login-box input {
  width: 100%; padding: 12px 15px;
  border-radius: var(--radius); border: 1px solid var(--gray);
  font-size: 14px; margin-bottom: 15px;
  background: #fafafa; transition: var(--transition);
}
.login-box input:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(199,169,123,0.2);
  background: white;
}
.login-box button {
  width: 100%; padding: 12px;
  background: var(--primary); color: white;
  border: none; border-radius: var(--radius);
  font-weight: 600; font-size: 14px;
  cursor: pointer; transition: var(--transition);
}
.login-box button:hover { background: var(--primary-dark); }
.login-box .error-msg {
  color: var(--danger); font-size: 12px;
  margin-top: 10px; min-height: 18px;
}

/* ===== Admin Panel Content ===== */
.admin-content { padding: 30px; flex: 1; display: none; }
.admin-content.active { display: block; }

.page-title {
  font-size: 1.6rem; font-weight: 700;
  color: var(--secondary); margin-bottom: 25px;
  position: relative; padding-bottom: 12px;
}
.page-title::after {
  content: ''; position: absolute; bottom: 0; left: 0;
  width: 60px; height: 3px; background: var(--primary);
}

/* Form Card */
.form-card {
  background: white; border-radius: var(--radius);
  padding: 30px; box-shadow: var(--shadow);
  border: 1px solid var(--gray); margin-bottom: 30px;
}
.form-card h3 {
  color: var(--secondary); font-size: 1.2rem;
  margin-bottom: 20px; padding-bottom: 12px;
  border-bottom: 1px solid var(--gray);
}
.form-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 18px; margin-bottom: 20px;
}
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full-width { grid-column: 1 / -1; }
.form-group label {
  font-size: 13px; font-weight: 600;
  color: var(--secondary); text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-group input, .form-group select, .form-group textarea {
  padding: 10px 14px; border-radius: var(--radius);
  border: 1px solid var(--gray); font-size: 14px;
  background: #fafafa; transition: var(--transition);
  font-family: inherit; width: 100%;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(199,169,123,0.2);
  background: white;
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group input[type="file"] { padding: 8px; background: white; }

/* Image preview */
.image-preview-grid {
  display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;
}
.image-preview-grid img {
  width: 90px; height: 90px; object-fit: cover;
  border-radius: var(--radius); border: 2px solid var(--gray);
}

/* Submit button */
.btn-submit {
  width: 100%; padding: 14px;
  background: var(--primary); color: white;
  border: none; border-radius: var(--radius);
  font-weight: 700; font-size: 15px;
  cursor: pointer; transition: var(--transition);
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-submit:hover { background: var(--primary-dark); transform: translateY(-2px); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* Status */
.status-msg {
  margin-top: 15px; padding: 12px 16px;
  border-radius: var(--radius); font-size: 14px;
  font-weight: 600; text-align: center; display: none;
}
.status-msg.success { background: #d4edda; color: #155724; display: block; border: 1px solid #c3e6cb; }
.status-msg.error { background: #f8d7da; color: #721c24; display: block; border: 1px solid #f5c6cb; }
.status-msg.info { background: #d1ecf1; color: #0c5460; display: block; border: 1px solid #bee5eb; }

/* Progress bar */
.progress-bar {
  width: 100%; height: 6px; background: var(--gray);
  border-radius: 3px; margin-top: 12px; overflow: hidden; display: none;
}
.progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar { width: 280px; transform: translateX(-100%); }
  .sidebar.active { transform: translateX(0); }
  .main-content { margin-left: 0 !important; }
  .form-grid { grid-template-columns: 1fr; }
  .admin-content { padding: 20px 15px; }
  .form-card { padding: 20px; }
  .mobile-toggle { display: block !important; }
}
.mobile-toggle {
  display: none;
  background: none; border: none;
  font-size: 1.3rem; color: var(--secondary);
  cursor: pointer; padding: 5px;
}
</style>
</head>
<body>

<!-- ============================================================ -->
<!-- LOGIN SCREEN -->
<!-- ============================================================ -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="icon-circle"><i class="fas fa-lock"></i></div>
    <h2>Admin Login</h2>
    <p>Enter password to access admin panel</p>
    <input type="password" id="adminPass" placeholder="Enter admin password"
           onkeypress="if(event.key==='Enter')checkLogin()">
    <button onclick="checkLogin()">Login</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- ============================================================ -->
<!-- ADMIN PANEL (hidden until login) -->
<!-- ============================================================ -->
<div id="adminRoot" style="display:none;">

  <!-- Mobile Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"
       style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999;"
       onclick="toggleMobileSidebar()"></div>

  <!-- ===== Sidebar ===== -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="stone.png" alt="Logo">
        <span>Admin Panel</span>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle" style="display:none;">
        <i class="fas fa-chevron-left"></i>
      </button>
    </div>
    <ul class="sidebar-nav">
      <li><a href="index.html"><i class="fas fa-home"></i> <span>View Site</span></a></li>
      <li><a href="#" class="active" onclick="showAddProduct()"><i class="fas fa-plus"></i> <span>Add Product</span></a></li>
      <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
    </ul>
  </div>

  <!-- ===== Main Content ===== -->
  <div class="main-content" id="main-content">

    <!-- Top Header -->
    <header class="top-header">
      <button class="mobile-toggle" id="mobile-toggle" onclick="toggleMobileSidebar()">
        <i class="fas fa-bars"></i>
      </button>
      <div class="user-profile">
        <div class="user-info">
          <div class="user-avatar"><i class="fas fa-user-shield"></i></div>
          <span class="user-name">Admin</span>
        </div>
        <button class="btn btn-outline" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </header>

    <!-- ===== Add Product Content ===== -->
    <div class="admin-content active" id="addProductContent">
      <h2 class="page-title">Add New Product</h2>

      <div class="form-card">
        <h3><i class="fas fa-cube" style="color:var(--primary);"></i> Product Details</h3>

        <div class="form-grid">
          <div class="form-group full-width">
            <label>Stone Name *</label>
            <input type="text" id="stoneName" placeholder="e.g. Raj Green Sandstone">
          </div>

          <div class="form-group">
            <label>Category *</label>
            <select id="category">
              <option value="sandstone">Sandstone</option>
              <option value="kota">Kota Stone</option>
              <option value="granite">Granite</option>
              <option value="marble">Marble</option>
              <option value="dholpur">Dholpur</option>
              <option value="tiles">Tiles</option>
              <option value="mandana">Mandana</option>
            </select>
          </div>

          <div class="form-group">
            <label>Sub-category</label>
            <input type="text" id="subCategory" placeholder="e.g. Slab, Tile">
          </div>

          <div class="form-group">
            <label>Color</label>
            <input type="text" id="color" placeholder="e.g. Green, Brown, White">
          </div>

          <div class="form-group">
            <label>Type</label>
            <input type="text" id="type" placeholder="e.g. Natural, Polished">
          </div>

          <div class="form-group full-width">
            <label>Description</label>
            <textarea id="description" placeholder="Product description..."></textarea>
          </div>

          <div class="form-group full-width">
            <label>Product Images (multiple allowed) *</label>
            <input type="file" id="imageInput" accept="image/*" multiple onchange="previewImages(event)">
            <div class="image-preview-grid" id="imagePreview"></div>
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
          </div>
        </div>

        <button class="btn-submit" id="addBtn" onclick="addProduct()">
          <i class="fas fa-cloud-upload-alt"></i> Add Product to Firebase
        </button>
        <div class="status-msg" id="statusMsg"></div>
      </div>
    </div>

  </div>
</div>

<!-- ============================================================ -->
<!-- SCRIPT -->
<!-- ============================================================ -->
<script type="module">
// ===== Tumhari config se import =====
import {
  db,
  collection,
  addDoc,
  serverTimestamp
} from './firebase-config.js';

// ===== Admin Settings =====
const CLOUD_NAME = "YOUR_CLOUDINARY_CLOUD_NAME";     // ⚠️ apna Cloudinary cloud name
const UPLOAD_PRESET = "stone_admin_upload";          // ⚠️ apna unsigned preset
const ADMIN_PASSWORD = "mySecret123";                 // ⚠️ apna password

let selectedFiles = [];
let isLoggedIn = false;

// ===== Login =====
window.checkLogin = function() {
  const pass = document.getElementById('adminPass').value;
  const errorEl = document.getElementById('loginError');

  if (pass === ADMIN_PASSWORD) {
    isLoggedIn = true;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminRoot').style.display = 'block';
    errorEl.textContent = '';
  } else {
    errorEl.textContent = '❌ Wrong password! Try again.';
  }
};

// ===== Logout =====
window.logout = function() {
  isLoggedIn = false;
  document.getElementById('adminRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminPass').value = '';
};

// ===== Mobile Sidebar Toggle =====
window.toggleMobileSidebar = function() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.toggle('active');
  overlay.style.display = sidebar.classList.contains('active') ? 'block' : 'none';
};

// ===== Show Add Product (already default) =====
window.showAddProduct = function() {
  document.getElementById('addProductContent').classList.add('active');
};

// ===== Image Preview =====
window.previewImages = function(event) {
  selectedFiles = Array.from(event.target.files);
  const preview = document.getElementById('imagePreview');
  preview.innerHTML = '';

  selectedFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = document.createElement('img');
      img.src = e.target.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
};

// ===== Cloudinary Upload =====
async function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', UPLOAD_PRESET);

  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
    method: 'POST',
    body: formData
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || 'Cloudinary upload failed');
  }
  const data = await res.json();
  return data.secure_url;
}

// ===== Add Product =====
window.addProduct = async function() {
  const statusEl = document.getElementById('statusMsg');
  const btn = document.getElementById('addBtn');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');

  statusEl.className = 'status-msg';
  statusEl.textContent = '';

  const name = document.getElementById('stoneName').value.trim();
  const category = document.getElementById('category').value;
  const subCategory = document.getElementById('subCategory').value.trim();
  const color = document.getElementById('color').value.trim();
  const type = document.getElementById('type').value.trim();
  const description = document.getElementById('description').value.trim();
  const files = document.getElementById('imageInput').files;

  if (!name || !files.length) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = '❌ Stone Name aur kam se kam 1 image required hai!';
    return;
  }

  btn.disabled = true;
  progressBar.style.display = 'block';
  progressFill.style.width = '0%';

  try {
    statusEl.className = 'status-msg info';
    statusEl.textContent = `⏳ Uploading ${files.length} image(s) to Cloudinary...`;

    const imageUrls = [];
    for (let i = 0; i < files.length; i++) {
      statusEl.textContent = `⏳ Uploading image ${i + 1}/${files.length}...`;
      const url = await uploadToCloudinary(files[i]);
      imageUrls.push(url);
      progressFill.style.width = `${Math.round(((i + 1) / files.length) * 70)}%`;
    }

    statusEl.textContent = '⏳ Saving product to Firebase...';
    progressFill.style.width = '90%';

    await addDoc(collection(db, "products"), {
      stone_name: name,
      category: category,
      sub_category: subCategory,
      color: color,
      type: type,
      description: description,
      images: imageUrls,
      created_at: serverTimestamp()
    });

    progressFill.style.width = '100%';

    statusEl.className = 'status-msg success';
    statusEl.textContent = `✅ Product "${name}" added successfully! (${imageUrls.length} image(s))`;

    document.getElementById('stoneName').value = '';
    document.getElementById('subCategory').value = '';
    document.getElementById('color').value = '';
    document.getElementById('type').value = '';
    document.getElementById('description').value = '';
    document.getElementById('imageInput').value = '';
    document.getElementById('imagePreview').innerHTML = '';
    selectedFiles = [];

    setTimeout(() => {
      progressBar.style.display = 'none';
      progressFill.style.width = '0%';
    }, 2000);

  } catch (err) {
    console.error(err);
    statusEl.className = 'status-msg error';
    statusEl.textContent = '❌ Error: ' + err.message;
    progressBar.style.display = 'none';
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
