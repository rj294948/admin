<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Product Uploader - Rajasthan Sandstone Hub</title>
  <style>
    body { background: #0a0a0a; color: #fff; font-family: sans-serif; padding: 20px; }
    .box { max-width: 500px; margin: 30px auto; background: #151515; padding: 25px; border-radius: 10px; border: 1px solid #222; }
    h2 { color: #c7a97b; margin-bottom: 20px; text-align: center; }
    input, select, textarea { width: 100%; padding: 10px; margin-bottom: 14px; background: #0d0d0d; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #c7a97b; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: 0.6; }
  </style>
</head>
<body>

<div class="box">
  <h2>Upload Stone Product</h2>
  <form id="product-form">
    <input type="password" id="adminKey" placeholder="Enter Secret Admin Key" required>
    
    <select id="category" required>
      <option value="">Select Stone Category</option>
      <option value="sandstone">Sandstone</option>
      <option value="kota">Kota Stone</option>
      <option value="granite">Granite</option>
      <option value="marble">Marble</option>
      <option value="dholpur">Dholpur</option>
      <option value="tiles">Tiles</option>
      <option value="mandana">Mandana</option>
    </select>

    <input type="text" id="name" placeholder="Stone Name (e.g., Bijoliya Red Sandstone)" required>
    <input type="text" id="price" placeholder="Price (e.g., ₹45 / sq.ft)" required>
    <input type="text" id="finish" placeholder="Finish (e.g., Natural, Honed, Polished)">
    <textarea id="description" rows="3" placeholder="Stone Size, Thickness & Details"></textarea>
    <input type="file" id="imageFile" accept="image/*" required>

    <button type="submit" id="submitBtn">Upload Product</button>
  </form>
</div>

<script type="module">
  import { 
    auth, db, storage, 
    collection, addDoc, serverTimestamp, 
    ref, uploadBytes, getDownloadURL 
  } from "./firebase-config.js";
  import { signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

  const form = document.getElementById("product-form");
  const submitBtn = document.getElementById("submitBtn");

  // Background me silently anonymous session start karega (bina kisi login popup ke)
  signInAnonymously(auth).catch((err) => console.error("Auth error:", err));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Uploading...";

    try {
      const adminKey = document.getElementById("adminKey").value.trim();
      const category = document.getElementById("category").value;
      const name = document.getElementById("name").value.trim();
      const price = document.getElementById("price").value.trim();
      const finish = document.getElementById("finish").value.trim();
      const description = document.getElementById("description").value.trim();
      const file = document.getElementById("imageFile").files[0];

      // 1. Image ko Firebase Storage me upload karein
      const storageRef = ref(storage, `products/${category}/${Date.now()}_${file.name}`);
      const snapshot = await uploadBytes(storageRef, file);
      const imageUrl = await getDownloadURL(snapshot.ref);

      // 2. Product data ko Firestore me save karein
      await addDoc(collection(db, "products"), {
        adminKey, // Security rule isi ko check karega
        category,
        name,
        price,
        finish,
        description,
        imageUrl,
        createdAt: serverTimestamp()
      });

      alert("Product successfully upload ho gaya!");
      form.reset();
    } catch (error) {
      alert("Upload Failed: " + error.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Upload Product";
    }
  });
</script>
</body>
</html>
