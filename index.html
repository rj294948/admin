<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Product Uploader - Rajasthan Sandstone Hub</title>
<meta name="description" content="Upload and manage stone products with multi-image & camera support for Rajasthan Sandstone Hub.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="stone.png" type="image/png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #c7a97b;
  --primary-dark: #a88958;
  --bg-dark: #0a0a0a;
  --bg-card: #151515;
  --text-light: #ffffff;
  --text-muted: #888888;
  --border-color: #222222;
  --transition: all 0.3s ease;
  --font-head: 'Oswald', sans-serif;
  --font-body: 'Montserrat', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  color: var(--text-light);
  background: var(--bg-dark);
  overflow-x: hidden;
  font-size: 14px;
  padding-bottom: 80px;
}

a { color: inherit; text-decoration: none; }

.navbar-wrapper {
  position: sticky;
  top: 0;
  width: 100%;
  background: rgba(10, 10, 10, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-color);
  z-index: 1000;
}
.nav-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  gap: 20px;
  height: 76px;
  max-width: 1700px;
  margin: 0 auto;
}
.nav-brand {
  font-family: var(--font-head);
  font-size: 1.5rem;
  font-weight: 700;
  color: white;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
  text-decoration: none;
  flex-shrink: 0;
}
.nav-brand span { color: var(--primary); }
.nav-brand img { height: 38px; }

.upload-section {
  max-width: 800px;
  margin: 40px auto;
  padding: 0 20px;
}

.section-header {
  margin-bottom: 30px;
  text-align: center;
}
.section-title {
  font-size: 2rem;
  font-family: var(--font-head);
  color: white;
  letter-spacing: 2px;
  font-weight: 600;
  text-transform: uppercase;
  margin-bottom: 10px;
  position: relative;
  display: inline-block;
  padding-bottom: 12px;
}
.section-title::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 3px;
  background: var(--primary);
}
.section-subtitle {
  color: var(--text-muted);
  font-size: 0.85rem;
  letter-spacing: 0.5px;
}

.upload-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 40px;
  position: relative;
  overflow: hidden;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-family: var(--font-head);
  font-size: 0.9rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--primary);
  margin-bottom: 8px;
}

.form-control {
  width: 100%;
  padding: 12px 16px;
  background: #0d0d0d;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  color: white;
  font-family: var(--font-body);
  font-size: 0.9rem;
  transition: var(--transition);
}

.form-control:focus {
  outline: none;
  border-color: var(--primary);
  background: rgba(199,169,123,0.02);
}

textarea.form-control {
  resize: vertical;
  min-height: 100px;
}

select.form-control {
  cursor: pointer;
}

.media-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 10px;
}

.media-box {
  background: #0d0d0d;
  border: 1px dashed var(--border-color);
  padding: 15px;
  border-radius: 6px;
  text-align: center;
}

.media-box label {
  cursor: pointer;
  font-size: 0.82rem;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
}

.media-box label i {
  font-size: 1.4rem;
  color: var(--primary);
}

.preview-container {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.preview-thumb {
  width: 70px;
  height: 70px;
  border-radius: 6px;
  object-fit: cover;
  border: 1px solid var(--primary);
}

.btn-submit {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: #000;
  font-family: var(--font-head);
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: var(--transition);
  margin-top: 10px;
}

.btn-submit:hover {
  background: var(--primary-dark);
  transform: translateY(-2px);
}

.btn-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

footer {
  background: #000;
  border-top: 1px solid var(--border-color);
  color: var(--text-muted);
  text-align: center;
  padding: 30px 20px;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 60px;
}
footer .footer-brand {
  color: white;
  font-family: var(--font-head);
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: 2px;
  margin-bottom: 10px;
}
footer .footer-brand span { color: var(--primary); }

@media (max-width: 768px) {
  .upload-section { padding: 0 12px; margin: 20px auto; }
  .upload-card { padding: 24px 18px; }
  .section-title { font-size: 1.5rem; }
  .media-options { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="navbar-wrapper">
  <div class="nav-row-top">
    <a href="#" class="nav-brand">
      <img src="stone.png" alt="Logo">
      <span class="text">RAJASTHAN</span> <span>HUB</span>
    </a>
  </div>
</div>

<section class="upload-section">
  <div class="section-header">
    <h1 class="section-title">Product Uploader</h1>
    <p class="section-subtitle">Multi-image & camera enabled stone product uploader</p>
  </div>

  <div class="upload-card">
    <form id="product-form">
      
      <div class="form-group">
        <label for="adminKey">Secret Admin Key</label>
        <input type="password" id="adminKey" class="form-control" placeholder="Enter security PIN" required>
      </div>

      <div class="form-group">
        <label for="category">Stone Category</label>
        <select id="category" class="form-control" required>
          <option value="">Select Category</option>
          <option value="sandstone">Sandstone</option>
          <option value="kota">Kota Stone</option>
          <option value="granite">Granite</option>
          <option value="marble">Marble</option>
          <option value="dholpur">Dholpur</option>
          <option value="tiles">Tiles</option>
          <option value="mandana">Mandana</option>
        </select>
      </div>

      <div class="form-group">
        <label for="name">Product Name</label>
        <input type="text" id="name" class="form-control" placeholder="e.g., Bijoliya Teak Sandstone" required>
      </div>

      <div class="form-group">
        <label for="price">Price / Rate</label>
        <input type="text" id="price" class="form-control" placeholder="e.g., ₹45 / sq.ft" required>
      </div>

      <div class="form-group">
        <label for="finish">Surface Finish</label>
        <input type="text" id="finish" class="form-control" placeholder="e.g., Natural, Honed, Polished, Calibrated">
      </div>

      <div class="form-group">
        <label for="description">Product Details & Specifications</label>
        <textarea id="description" class="form-control" placeholder="Enter size, thickness, applications, and other details..."></textarea>
      </div>

      <!-- MULTI-IMAGE & CAMERA UPLOAD SECTION -->
      <div class="form-group">
        <label>Product Images (Select Multiple or Click Photo)</label>
        
        <div class="media-options">
          <!-- Gallery Multi-select -->
          <div class="media-box">
            <label for="galleryInput">
              <i class="fas fa-images"></i>
              <span>Upload from Gallery (Multiple)</span>
            </label>
            <input type="file" id="galleryInput" accept="image/*" multiple style="display:none;">
          </div>

          <!-- Direct Camera Capture -->
          <div class="media-box">
            <label for="cameraInput">
              <i class="fas fa-camera"></i>
              <span>Capture Live Photo</span>
            </label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
          </div>
        </div>

        <!-- Image Preview Container -->
        <div class="preview-container" id="previewContainer"></div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Upload Product</button>
    </form>
  </div>
</section>

<footer>
  <div class="footer-brand">RAJASTHAN <span>HUB</span></div>
  <div class="footer-copy">&copy; 2026 Rajasthan Sandstone Hub · All Rights Reserved</div>
</footer>

<script type="module">
  import { 
    auth, db, storage, 
    collection, addDoc, serverTimestamp, 
    ref, uploadBytes, getDownloadURL 
  } from "./firebase-config.js";
  import { signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

  const form = document.getElementById("product-form");
  const submitBtn = document.getElementById("submitBtn");
  const galleryInput = document.getElementById("galleryInput");
  const cameraInput = document.getElementById("cameraInput");
  const previewContainer = document.getElementById("previewContainer");

  let selectedFiles = [];

  // Background anonymous auth sign-in
  signInAnonymously(auth).catch((err) => console.error("Auth error:", err));

  // Handle Gallery (Multiple) Selection
  galleryInput.addEventListener("change", (e) => {
    handleFiles(e.target.files);
  });

  // Handle Camera Capture
  cameraInput.addEventListener("change", (e) => {
    handleFiles(e.target.files);
  });

  function handleFiles(files) {
    for (let file of files) {
      selectedFiles.push(file);
    }
    renderPreviews();
  }

  function renderPreviews() {
    previewContainer.innerHTML = "";
    selectedFiles.forEach((file, index) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = document.createElement("img");
        img.src = e.target.result;
        img.className = "preview-thumb";
        img.title = `Image ${index + 1} (Click to remove)`;
        img.onclick = () => {
          selectedFiles.splice(index, 1);
          renderPreviews();
        };
        previewContainer.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (selectedFiles.length === 0) {
      alert("Kripya kam se kam ek product image select ya capture karein!");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Uploading Images & Product...";

    try {
      const adminKey = document.getElementById("adminKey").value.trim();
      const category = document.getElementById("category").value;
      const name = document.getElementById("name").value.trim();
      const price = document.getElementById("price").value.trim();
      const finish = document.getElementById("finish").value.trim();
      const description = document.getElementById("description").value.trim();

      // 1. Upload all selected images to Firebase Storage
      let imageUrls = [];
      for (let i = 0; i < selectedFiles.length; i++) {
        let file = selectedFiles[i];
        submitBtn.textContent = `Uploading image ${i + 1} of ${selectedFiles.length}...`;
        const storageRef = ref(storage, `products/${category}/${Date.now()}_${file.name}`);
        const snapshot = await uploadBytes(storageRef, file);
        const downloadUrl = await getDownloadURL(snapshot.ref);
        imageUrls.push(downloadUrl);
      }

      submitBtn.textContent = "Saving to Database...";

      // 2. Save product metadata in Firestore (with imageUrls array and first image as main imageUrl)
      await addDoc(collection(db, "products"), {
        adminKey,
        category,
        name,
        price,
        finish,
        description,
        imageUrl: imageUrls[0], // Main image for backward compatibility
        imageUrls: imageUrls,   // Array of all uploaded images
        createdAt: serverTimestamp()
      });

      alert("Product aur sabhi images successfully upload ho gayi!");
      form.reset();
      selectedFiles = [];
      previewContainer.innerHTML = "";
    } catch (error) {
      alert("Upload Failed: " + error.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Upload Product";
    }
  });
</script>
</body>
</html>
