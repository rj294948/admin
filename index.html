<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin & Banner Control Panel - Rajasthan Sandstone Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #c7a97b;
  --primary-dark: #a88958;
  --bg-dark: #0a0a0a;
  --bg-card: #151515;
  --text-light: #ffffff;
  --text-muted: #888888;
  --border-color: #222222;
  --font-head: 'Oswald', sans-serif;
  --font-body: 'Montserrat', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); color: var(--text-light); background: var(--bg-dark); font-size: 14px; padding-bottom: 80px; }
.upload-section { max-width: 900px; margin: 40px auto; padding: 0 20px; }
.section-title { font-size: 2rem; font-family: var(--font-head); color: white; text-align: center; text-transform: uppercase; margin-bottom: 25px; }
.upload-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 35px; margin-bottom: 30px; }
.card-subtitle { font-family: var(--font-head); font-size: 1.2rem; color: var(--primary); margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.form-group { margin-bottom: 15px; }
.form-group.full-width { grid-column: span 2; }
.form-group label { display: block; font-family: var(--font-head); font-size: 0.85rem; color: var(--primary); margin-bottom: 6px; text-transform: uppercase; }
.form-control { width: 100%; padding: 12px 16px; background: #0d0d0d; border: 1px solid var(--border-color); border-radius: 6px; color: white; font-size: 0.9rem; }
.form-control:focus { outline: none; border-color: var(--primary); }
textarea.form-control { resize: vertical; min-height: 90px; }
.media-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.media-box { background: #0d0d0d; border: 1px dashed var(--border-color); padding: 20px; border-radius: 6px; text-align: center; }
.media-box label { cursor: pointer; color: var(--text-muted); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.media-box label i { font-size: 1.5rem; color: var(--primary); }
.preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.preview-thumb { width: 75px; height: 75px; border-radius: 6px; object-fit: cover; border: 1px solid var(--primary); }
.btn-submit { width: 100%; padding: 14px; background: var(--primary); color: #000; font-family: var(--font-head); font-size: 1.05rem; font-weight: 600; text-transform: uppercase; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: background 0.3s; }
.btn-submit:hover { background: var(--primary-dark); }
@media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .form-group.full-width { grid-column: span 1; } .media-options { grid-template-columns: 1fr; } }
.admin-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--primary);
  color: var(--primary);
  border-radius: 4px;
  font-family: var(--font-head);
  text-transform: uppercase;
  font-size: 0.85rem;
  text-decoration: none;
  transition: all 0.3s ease;
  margin: 20px;
}
.admin-link-btn:hover { background: var(--primary); color: #000; }
</style>
</head>
<body>

<!-- Navigation Back to Home -->
<a href="index.html" class="admin-link-btn">
  <i class="fas fa-home"></i> Back to Home
</a>

<section class="upload-section">
  <h1 class="section-title">Admin Management Panel</h1>

  <!-- SECTION 1: HERO / TOP SHOWCASE BANNER UPLOADER -->
  <div class="upload-card">
    <div class="card-subtitle"><i class="fas fa-image"></i> Upload Hero / Showcase Banner Images</div>
    <form id="banner-form">
      <div class="form-grid">
        <div class="form-group full-width">
          <label>Banner Title / Tagline</label>
          <input type="text" id="bannerTitle" class="form-control" value="Rajasthan Sandstone Hub - Premium Collection" required>
        </div>
        <div class="form-group full-width">
          <label>Banner Image (Select or Capture Live Photo)</label>
          <div class="media-options">
            <div class="media-box">
              <label for="bannerInput">
                <i class="fas fa-images"></i>
                <span>Select Banner File</span>
              </label>
              <input type="file" id="bannerInput" accept="image/*" style="display:none;">
            </div>
            <div class="media-box">
              <label for="bannerInputCam">
                <i class="fas fa-camera"></i>
                <span>Capture Banner Photo</span>
              </label>
              <input type="file" id="bannerInputCam" accept="image/*" capture="environment" style="display:none;">
            </div>
          </div>
          <div class="preview-container" id="bannerPreviewContainer"></div>
        </div>
      </div>
      <button type="submit" id="bannerBtn" class="btn-submit">Upload to 'hero_images' Collection</button>
    </form>
  </div>

  <!-- SECTION 2: STONE PRODUCTS UPLOADER -->
  <div class="upload-card">
    <div class="card-subtitle"><i class="fas fa-boxes"></i> Upload Stone Products</div>
    <form id="product-form">
      <div class="form-grid">
        
        <div class="form-group">
          <label>Stone Name</label>
          <input type="text" id="stone_name" class="form-control" value="Sandstone - Blasted Brushed" required>
        </div>

        <div class="form-group">
          <label>Category</label>
          <input type="text" id="category" class="form-control" value="Sand Stone" required>
        </div>

        <div class="form-group">
          <label>Sub Category</label>
          <input type="text" id="sub_category" class="form-control" value="Slabs / Tiles" required>
        </div>

        <div class="form-group">
          <label>Type</label>
          <input type="text" id="type" class="form-control" value="Natural" required>
        </div>

        <div class="form-group">
          <label>Finish</label>
          <input type="text" id="finish" class="form-control" value="Blasted Brushed" required>
        </div>

        <div class="form-group">
          <label>Color</label>
          <input type="text" id="color" class="form-control" value="Blasted Brushed" required>
        </div>

        <div class="form-group">
          <label>Price (₹)</label>
          <input type="number" id="price" class="form-control" value="98" required>
        </div>

        <div class="form-group">
          <label>Price Unit</label>
          <input type="text" id="price_unit" class="form-control" value="sqft" required>
        </div>

        <div class="form-group">
          <label>Size</label>
          <input type="text" id="size" class="form-control" value="Standard / Custom">
        </div>

        <div class="form-group">
          <label>Thickness</label>
          <input type="text" id="thickness" class="form-control" value="20-40 mm">
        </div>

        <div class="form-group">
          <label>Density</label>
          <input type="text" id="density" class="form-control" value="2.4 - 2.6 g/cm³">
        </div>

        <div class="form-group">
          <label>Compressive Strength</label>
          <input type="text" id="compressive_strength" class="form-control" value="1900 kg/cm²">
        </div>

        <div class="form-group">
          <label>Water Absorption</label>
          <input type="text" id="water_absorption" class="form-control" value="1.5 - 2.5%">
        </div>

        <div class="form-group">
          <label>Factory Name</label>
          <input type="text" id="factory_name" class="form-control" value="RJ Sand Stones">
        </div>

        <div class="form-group">
          <label>Contact Number</label>
          <input type="text" id="contact_number" class="form-control" value="+91 7737740207">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" class="form-control" value="ravijain236129@gmail.com">
        </div>

        <div class="form-group full-width">
          <label>Address</label>
          <input type="text" id="address" class="form-control" value="NEAR MINING OFFICE , BIJOLIYA">
        </div>

        <div class="form-group full-width">
          <label>Usage / Applications</label>
          <input type="text" id="usage" class="form-control" value="Interior Feature Floors, Modern Patios, Walkways">
        </div>

        <div class="form-group full-width">
          <label>Description</label>
          <textarea id="description" class="form-control">Blasted and subsequently brushed to soften the textured feel while accentuating natural stone details.</textarea>
        </div>

        <!-- PRODUCT IMAGES UPLOAD -->
        <div class="form-group full-width">
          <label>Product Images (Multiple Gallery / Live Camera)</label>
          <div class="media-options">
            <div class="media-box">
              <label for="imageInput">
                <i class="fas fa-images"></i>
                <span>Select Multiple Images</span>
              </label>
              <input type="file" id="imageInput" accept="image/*" multiple style="display:none;">
            </div>
            <div class="media-box">
              <label for="imageInputCam">
                <i class="fas fa-camera"></i>
                <span>Capture Live Camera Photo</span>
              </label>
              <input type="file" id="imageInputCam" accept="image/*" capture="environment" style="display:none;">
            </div>
          </div>
          <div class="preview-container" id="productPreviewContainer"></div>
        </div>

      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Upload Product to 'products' Collection</button>
    </form>
  </div>
</section>

<script type="module">
  import { db, collection, addDoc, serverTimestamp } from "./firebase-config.js";

  // Keyless Free Image Uploader (Catbox API - never fails, no API key required)
  async function uploadToImageHosting(file) {
    const formData = new FormData();
    formData.append("reqtype", "fileupload");
    formData.append("fileToUpload", file);

    const res = await fetch("https://catbox.moe/user/api.php", {
      method: "POST",
      body: formData
    });
    
    const url = await res.text();
    if (url && url.startsWith("http")) {
      return url.trim();
    } else {
      throw new Error("Image upload failed");
    }
  }

  // --- 1. HERO BANNER UPLOAD LOGIC ---
  const bannerForm = document.getElementById("banner-form");
  const bannerBtn = document.getElementById("bannerBtn");
  const bannerInput = document.getElementById("bannerInput");
  const bannerInputCam = document.getElementById("bannerInputCam");
  const bannerPreviewContainer = document.getElementById("bannerPreviewContainer");
  let selectedBannerFile = null;

  function handleBannerFile(file) {
    selectedBannerFile = file;
    bannerPreviewContainer.innerHTML = '';
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = document.createElement("img");
      img.src = e.target.result;
      img.className = "preview-thumb";
      bannerPreviewContainer.appendChild(img);
    };
    reader.readAsDataURL(file);
  }

  bannerInput.addEventListener("change", (e) => { if(e.target.files[0]) handleBannerFile(e.target.files[0]); });
  bannerInputCam.addEventListener("change", (e) => { if(e.target.files[0]) handleBannerFile(e.target.files[0]); });

  bannerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!selectedBannerFile) {
      alert("Kripya banner ke liye ek image select ya capture karein!");
      return;
    }

    bannerBtn.disabled = true;
    bannerBtn.textContent = "Uploading Banner Image...";

    try {
      const imageUrl = await uploadToImageHosting(selectedBannerFile);

      await addDoc(collection(db, "hero_images"), {
        title: document.getElementById("bannerTitle").value.trim(),
        imageUrl: imageUrl,
        created_at: serverTimestamp()
      });

      alert("Hero Banner successfully 'hero_images' collection me upload ho gaya!");
      bannerForm.reset();
      selectedBannerFile = null;
      bannerPreviewContainer.innerHTML = "";
    } catch (error) {
      alert("Banner Upload Failed: " + error.message);
    } finally {
      bannerBtn.disabled = false;
      bannerBtn.textContent = "Upload to 'hero_images' Collection";
    }
  });

  // --- 2. PRODUCT UPLOAD LOGIC ---
  const productForm = document.getElementById("product-form");
  const submitBtn = document.getElementById("submitBtn");
  const imageInput = document.getElementById("imageInput");
  const imageInputCam = document.getElementById("imageInputCam");
  const productPreviewContainer = document.getElementById("productPreviewContainer");

  let selectedProductFiles = [];

  function handleProductFiles(files) {
    for (let file of files) {
      selectedProductFiles.push(file);
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = document.createElement("img");
        img.src = e.target.result;
        img.className = "preview-thumb";
        productPreviewContainer.appendChild(img);
      };
      reader.readAsDataURL(file);
    }
  }

  imageInput.addEventListener("change", (e) => handleProductFiles(e.target.files));
  imageInputCam.addEventListener("change", (e) => handleProductFiles(e.target.files));

  productForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (selectedProductFiles.length === 0) {
      alert("Kripya kam se kam ek product image select ya capture karein!");
      return;
    }

    submitBtn.disabled = true;

    try {
      let uploadedImageUrls = [];
      for (let i = 0; i < selectedProductFiles.length; i++) {
        submitBtn.textContent = `Uploading image ${i + 1} of ${selectedProductFiles.length}...`;
        
        if (i > 0) {
          await new Promise(resolve => setTimeout(resolve, 500));
        }

        const url = await uploadToImageHosting(selectedProductFiles[i]);
        uploadedImageUrls.push(url);
      }

      submitBtn.textContent = "Saving to Database...";

      await addDoc(collection(db, "products"), {
        stone_name: document.getElementById("stone_name").value.trim(),
        category: document.getElementById("category").value.trim(),
        sub_category: document.getElementById("sub_category").value.trim(),
        type: document.getElementById("type").value.trim(),
        finish: document.getElementById("finish").value.trim(),
        color: document.getElementById("color").value.trim(),
        price: Number(document.getElementById("price").value),
        price_unit: document.getElementById("price_unit").value.trim(),
        size: document.getElementById("size").value.trim(),
        thickness: document.getElementById("thickness").value.trim(),
        density: document.getElementById("density").value.trim(),
        compressive_strength: document.getElementById("compressive_strength").value.trim(),
        water_absorption: document.getElementById("water_absorption").value.trim(),
        factory_name: document.getElementById("factory_name").value.trim(),
        contact_number: document.getElementById("contact_number").value.trim(),
        email: document.getElementById("email").value.trim(),
        address: document.getElementById("address").value.trim(),
        usage: document.getElementById("usage").value.trim(),
        description: document.getElementById("description").value.trim(),
        images: uploadedImageUrls,
        gst_number: "",
        userId: "admin_uploader",
        created_at: serverTimestamp()
      });

      alert("Product successfully upload ho gaya!");
      productForm.reset();
      selectedProductFiles = [];
      productPreviewContainer.innerHTML = "";
    } catch (error) {
      alert("Product Upload Failed: " + error.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Upload Product to 'products' Collection";
    }
  });
</script>
</body>
</html>
