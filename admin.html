<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Image Link Generator - Rajasthan Sandstone Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary: #c7a97b;
  --bg-dark: #0a0a0a;
  --bg-card: #151515;
  --text-light: #ffffff;
  --border-color: #222222;
  --font-head: 'Oswald', sans-serif;
  --font-body: 'Montserrat', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); color: var(--text-light); background: var(--bg-dark); padding: 20px; }
.container { max-width: 600px; margin: 40px auto; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 30px; }
h1 { font-family: var(--font-head); color: var(--primary); font-size: 1.8rem; text-align: center; margin-bottom: 20px; text-transform: uppercase; }
.upload-box { border: 2px dashed var(--border-color); padding: 30px; text-align: center; border-radius: 6px; cursor: pointer; margin-bottom: 20px; background: #0d0d0d; }
.upload-box i { font-size: 2.5rem; color: var(--primary); margin-bottom: 10px; }
.upload-box span { display: block; color: #888; font-size: 0.9rem; }
.btn { width: 100%; padding: 14px; background: var(--primary); color: #000; font-family: var(--font-head); font-weight: 600; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-size: 1rem; transition: background 0.3s; }
.btn:hover { background: #b09367; }
.result-box { margin-top: 20px; background: #0d0d0d; padding: 15px; border-radius: 6px; display: none; border: 1px solid var(--border-color); }
.result-box input { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; margin-top: 5px; font-size: 0.9rem; }
.preview { width: 100%; max-height: 220px; object-fit: cover; border-radius: 6px; margin-top: 15px; display: none; border: 1px solid var(--primary); }
.back-btn { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-family: var(--font-head); text-transform: uppercase; font-size: 0.85rem; border: 1px solid var(--primary); padding: 8px 16px; border-radius: 4px; }
.back-btn:hover { background: var(--primary); color: #000; }
</style>
</head>
<body>

<a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

<div class="container">
  <h1>Hero Image Link Generator</h1>
  <form id="uploadForm">
    <div class="upload-box" onclick="document.getElementById('imageFile').click()">
      <i class="fas fa-camera-retro"></i>
      <span>Click to Select Image or Capture Live Photo</span>
      <input type="file" id="imageFile" accept="image/*" capture="environment" style="display:none;" required>
    </div>
    
    <img id="imagePreview" class="preview">
    
    <button type="submit" id="uploadBtn" class="btn" style="margin-top:20px;">Upload & Generate Link</button>
  </form>

  <div class="result-box" id="resultBox">
    <label style="color: var(--primary); font-family: var(--font-head); text-transform: uppercase; font-size: 0.85rem;">Generated Image Link (Saved in Firebase):</label>
    <input type="text" id="linkOutput" readonly onclick="this.select()">
  </div>
</div>

<script type="module">
  import { db, collection, addDoc, serverTimestamp } from "./firebase-config.js";

  const fileInput = document.getElementById('imageFile');
  const preview = document.getElementById('imagePreview');
  const form = document.getElementById('uploadForm');
  const uploadBtn = document.getElementById('uploadBtn');
  const resultBox = document.getElementById('resultBox');
  const linkOutput = document.getElementById('linkOutput');

  let selectedFile = null;

  fileInput.addEventListener('change', (e) => {
    selectedFile = e.target.files[0];
    if (selectedFile) {
      const reader = new FileReader();
      reader.onload = (event) => {
        preview.src = event.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(selectedFile);
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!selectedFile) {
      alert('Kripya pehle image select karein!');
      return;
    }

    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading Image...';

    try {
      const reader = new FileReader();
      reader.onload = async () => {
        const base64Data = reader.result.split(',')[1];
        const formData = new FormData();
        formData.append("image", base64Data);

        const res = await fetch("https://api.imgbb.com/1/upload?key=6d207e02193a847aa98d0a989004f582", {
          method: "POST",
          body: formData
        });

        const data = await res.json();
        if (data.success) {
          const imageUrl = data.data.url;

          // Save link directly to Firebase 'hero_images' collection
          await addDoc(collection(db, "hero_images"), {
            imageUrl: imageUrl,
            created_at: serverTimestamp()
          });

          linkOutput.value = imageUrl;
          resultBox.style.display = 'block';
          alert('Image successfully upload ho gayi aur link generate ho gaya!');
        } else {
          throw new Error(data.error ? data.error.message : "Upload failed");
        }
      };
      reader.readAsDataURL(selectedFile);
    } catch (error) {
      alert("Error: " + error.message);
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Upload & Generate Link';
    }
  });
</script>
</body>
</html>
